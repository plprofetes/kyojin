name: Windows ROCm wheel
run-name: Windows ROCm wheel (gfx1151, build only)

# Builds exllamav3_ext for Windows against AMD's ROCm torch (gfx1151) with scripts/windows/kyojin_win.py and uploads the wheel
# as a workflow artifact. Build only: a hosted runner has no AMD GPU, so nothing is imported or run, and the wheel is never
# released from here. The CUDA wheels are build.yml's job; nothing there builds ROCm.
on:
  workflow_dispatch:
  push:                          # temporary: lets the workflow run from its own branch while it is being worked on
    branches: [ci/windows-rocm]

permissions:
  contents: read

jobs:
  wheel:
    name: windows-2022 ROCm gfx1151 wheel
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      # uv's cache on the same drive as the checkout and the venv (D:, about 220 GB free on windows-2022), so uv hardlinks
      # the wheels instead of copying them
      UV_CACHE_DIR: D:\uv-cache
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts (CPU, RAM, free disk, Visual Studio)
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object @{n='TotalGB';e={[math]::Round($_.TotalVisibleMemorySize/1MB,1)}}, @{n='FreeGB';e={[math]::Round($_.FreePhysicalMemory/1MB,1)}} | Format-List
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup (pinned ROCm torch, SDK and requirements)
        run: uv run --no-project python scripts/windows/kyojin_win.py setup --ci

      - name: Free disk after setup
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

      # The compile is 25 of the 26 minutes. The build tree is cached under a key that hashes every input (extension sources,
      # setup.py, the pins, the driver, this file) and the runner image version, and there is no restore-keys fallback: a hit
      # means the inputs are byte-identical, so the objects are valid; any other change builds in full.
      - name: Cache key
        id: meta
        run: |
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore the build tree (exact match only)
        id: objcache
        uses: actions/cache@v4
        with:
          # the build tree, plus the files torch's hipify writes into the source tree (the same patterns .gitignore lists);
          # the objects were compiled from them, so they must come back with the objects
          path: |
            build
            exllamav3/exllamav3_ext/**/*.hip
            exllamav3/exllamav3_ext/**/*_hip.*
            exllamav3/exllamav3_ext/**/hip_*.*
            !exllamav3/exllamav3_ext/hip/hip_mma.cuh
          key: winrocm-build-${{ steps.meta.outputs.image }}-${{ hashFiles('exllamav3/exllamav3_ext/**', 'setup.py', 'pyproject.toml', 'requirements.txt', 'scripts/windows/constraints-win.txt', 'scripts/windows/kyojin_win.py', '.github/workflows/windows-rocm.yml') }}

      # ninja rebuilds an object when an input is newer than it. After a checkout and a fresh venv every input is newer than
      # the restored objects, so give the inputs an old timestamp (the restored objects keep theirs), then show with
      # `ninja -d explain` what, if anything, it would still rebuild.
      - name: Make the restored objects count as up to date
        if: steps.objcache.outputs.cache-hit == 'true'
        run: |
          $old = [datetime]'2020-01-01'
          foreach ($d in 'exllamav3\exllamav3_ext', '.venv-win\Lib\site-packages\torch\include', '.venv-win\Lib\site-packages\_rocm_sdk_devel') {
            if (Test-Path $d) { Get-ChildItem $d -Recurse -File | ForEach-Object { $_.LastWriteTime = $old } }
          }
          $nj = Get-ChildItem build -Recurse -Filter build.ninja | Select-Object -First 1
          "build.ninja: $($nj.FullName)"
          & .venv-win\Scripts\ninja.exe -C $nj.DirectoryName -n -d explain | Select-Object -First 25
          $global:LASTEXITCODE = 0      # diagnostic only; the build below decides

      - name: Build the wheel
        run: uv run --no-project python scripts/windows/kyojin_win.py build --ci --wheel

      - name: Wheel contents
        run: |
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          & .venv-win\Scripts\python.exe -m zipfile -l (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-rocm-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload the run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rocm-logs
          path: logs/windows
          if-no-files-found: warn
