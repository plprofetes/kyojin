name: Windows ROCm wheel
run-name: Windows ROCm wheel (gfx1151, build only)

# Builds exllamav3_ext for Windows against AMD's ROCm torch (gfx1151) with scripts/windows/kyojin_win.py and uploads the wheel
# as a workflow artifact. Build only: a hosted runner has no AMD GPU, so nothing is imported or run, and the wheel is never
# released from here. The CUDA wheels are build.yml's job; nothing there builds ROCm.
on:
  workflow_dispatch:
  push:                          # temporary: lets the workflow run from its own branch while it is being worked on
    branches: [ci/windows-rocm]

permissions:
  contents: read

jobs:
  wheel:
    name: windows-2022 ROCm gfx1151 wheel
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      # uv's cache on the same drive as the checkout and the venv (D:, about 220 GB free on windows-2022), so uv hardlinks
      # the wheels instead of copying them
      UV_CACHE_DIR: D:\uv-cache
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts (CPU, RAM, free disk, Visual Studio)
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object @{n='TotalGB';e={[math]::Round($_.TotalVisibleMemorySize/1MB,1)}}, @{n='FreeGB';e={[math]::Round($_.FreePhysicalMemory/1MB,1)}} | Format-List
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup (pinned ROCm torch, SDK and requirements)
        run: uv run --no-project python scripts/windows/kyojin_win.py setup --ci

      - name: Free disk after setup
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

      - name: Build the wheel
        run: uv run --no-project python scripts/windows/kyojin_win.py build --ci --wheel

      - name: Wheel contents
        run: |
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          & .venv-win\Scripts\python.exe -m zipfile -l (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-rocm-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload the run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rocm-logs
          path: logs/windows
          if-no-files-found: warn
